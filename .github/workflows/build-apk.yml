name: Build APK

# Tap "Run workflow" in the Actions tab to build on demand, or let it run
# automatically whenever code lands on main.
on:
  workflow_dispatch:
  push:
    branches: [ main ]

# Required so the workflow can attach the APK to a GitHub Release.
permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Gradle 9.3.1
        run: |
          curl -sSL https://services.gradle.org/distributions/gradle-9.3.1-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /opt
          echo "/opt/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      # A stable signing key means every APK installs as an *update* over the last
      # one instead of failing with "package conflicts with an existing package".
      - name: Restore the signing keystore
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            printf '%s' "$KEYSTORE_B64" | base64 -d > debug.keystore
            echo "Using the repository's stable signing keystore."
          else
            echo "No DEBUG_KEYSTORE_BASE64 secret set - generating a throwaway key."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sp-launcher-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to a Release (direct download link)
        continue-on-error: true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: SP Launcher - latest APK
          body: "Auto-built debug APK. Download app-debug.apk and install it on your phone."
          files: app/build/outputs/apk/debug/*.apk
